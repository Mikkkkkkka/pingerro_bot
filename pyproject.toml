[project]
name = "ping-bot"
version = "0.1.0"
description = "Telegram bot that mentions active group members remembered from messages."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiogram (>=3.25.0,<4.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "psycopg[binary] (>=3.2,<4.0)",
]

[tool.poetry]
packages = [{ include = "ping_bot", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
